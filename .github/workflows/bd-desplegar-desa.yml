# desa: despliegue automático al integrar en la rama desa.
name: bd-desplegar-desa
on:
  workflow_call:
    inputs:
      plantillas:
        description: Versión de estas plantillas (la misma etiqueta con la que se llama el workflow)
        type: string
        default: v2

jobs:
  cd:
    name: CD · desa
    runs-on: [self-hosted, insis-db]
    environment: desa
    # Conexión de la base del ambiente: variables del environment, fuera del alcance del repo de BD.
    env:
      DB_HOST: ${{ vars.DB_HOST }}
      DB_PORT: ${{ vars.DB_PORT }}
      DB_SERVICE: ${{ vars.DB_SERVICE }}
      DB_USER: ${{ vars.DB_USER }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/checkout@v4
        with:
          repository: Fernando-FA/lab-devsecops-pipelines-bd
          ref: ${{ inputs.plantillas }}
          path: .plantillas
      - name: Último despliegue exitoso en desa
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "LB_DESDE=$(.plantillas/scripts/desplegado.sh desa)" >> "$GITHUB_ENV"
      - name: Desplegar
        env:
          INSIS_DEPLOY_PASSWORD: ${{ secrets.INSIS_DEPLOY_PASSWORD }}
        run: |
          .plantillas/scripts/lb.sh desa update
          .plantillas/scripts/lb.sh desa status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidencia-desa-${{ github.run_number }}
          path: evidencia/desa/

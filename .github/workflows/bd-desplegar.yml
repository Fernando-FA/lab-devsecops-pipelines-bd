# Despliegue común de test y prod: CI (plan, OPA y PRA) → aprobación del environment → CD (update, tag, EPP).
name: bd-desplegar
on:
  workflow_call:
    inputs:
      ambiente:
        type: string
        required: true
      ticket:
        type: string
        required: true
      plantillas:
        description: Versión de estas plantillas (la misma etiqueta con la que se llama el workflow)
        type: string
        default: v1

jobs:
  ci:
    name: CI · plan ${{ inputs.ambiente }}
    runs-on: [self-hosted, insis-db]
    environment: ${{ inputs.ambiente }}-plan
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/checkout@v4
        with:
          repository: Fernando-FA/lab-devsecops-pipelines-bd
          ref: ${{ inputs.plantillas }}
          path: .plantillas
      - name: Verificar rama, ticket y etiqueta
        id: v
        env:
          AMB: ${{ inputs.ambiente }}
          TICKET: ${{ inputs.ticket }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [ "$GITHUB_REF" = "refs/heads/$AMB" ] || { echo "::error::Se despliega desde la rama $AMB (se lanzó desde $GITHUB_REF)"; exit 1; }
          [[ "$TICKET" =~ ^[A-Z]{2,6}-?[0-9]{3,}$ ]] || { echo "::error::Ticket de Ivanti inválido: $TICKET"; exit 1; }
          version=$(.plantillas/scripts/version.sh de "$AMB" "$GITHUB_SHA") \
            || { echo "::error::La cabeza de $AMB no tiene etiqueta $AMB-v* (se crea al integrar en $AMB)"; exit 1; }
          if [ "$AMB" = prod ]; then
            [ "$(.plantillas/scripts/version.sh certificada "$GITHUB_SHA" || true)" = "$version" ] \
              || { echo "::error::prod no tiene el mismo contenido que test-v$version"; exit 1; }
            dep=$(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=test&sha=$(git rev-parse "test-v$version^{commit}")" --jq '.[0].id // empty')
            estado=$([ -n "$dep" ] && gh api "repos/$GITHUB_REPOSITORY/deployments/$dep/statuses" --jq '.[0].state' || true)
            [ "$estado" = success ] || { echo "::error::test-v$version no tiene un despliegue exitoso en test"; exit 1; }
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Plan (pendientes, SQL y rollback)
        env:
          INSIS_DEPLOY_PASSWORD: ${{ secrets.INSIS_DEPLOY_PASSWORD }}
          LB_SALIDA: evidencia/plan
        run: |
          .plantillas/scripts/lb.sh "${{ inputs.ambiente }}" validate
          .plantillas/scripts/lb.sh "${{ inputs.ambiente }}" status
          .plantillas/scripts/lb.sh "${{ inputs.ambiente }}" update-sql
          .plantillas/scripts/lb.sh "${{ inputs.ambiente }}" future-rollback-sql
      - name: OPA y PRA
        env:
          AMB: ${{ inputs.ambiente }}
          TICKET: ${{ inputs.ticket }}
          VERSION: ${{ steps.v.outputs.version }}
        run: .plantillas/scripts/documentos.sh opa > evidencia/plan/OPA.md && cat evidencia/plan/OPA.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: OPA-PRA-${{ inputs.ambiente }}-v${{ steps.v.outputs.version }}-${{ github.run_number }}
          path: evidencia/plan/

  cd:
    name: CD · ${{ inputs.ambiente }}
    needs: ci
    runs-on: [self-hosted, insis-db]
    environment:
      name: ${{ inputs.ambiente }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/checkout@v4
        with:
          repository: Fernando-FA/lab-devsecops-pipelines-bd
          ref: ${{ inputs.plantillas }}
          path: .plantillas
      - name: Desplegar y etiquetar la base
        env:
          INSIS_DEPLOY_PASSWORD: ${{ secrets.INSIS_DEPLOY_PASSWORD }}
          LB_SALIDA: evidencia/cd
        run: |
          .plantillas/scripts/lb.sh "${{ inputs.ambiente }}" update
          .plantillas/scripts/lb.sh "${{ inputs.ambiente }}" tag "${{ inputs.ambiente }}-v${{ needs.ci.outputs.version }}"
          .plantillas/scripts/lb.sh "${{ inputs.ambiente }}" status
      - name: Evidencia
        if: always()
        env:
          AMB: ${{ inputs.ambiente }}
          TICKET: ${{ inputs.ticket }}
          VERSION: ${{ needs.ci.outputs.version }}
          RESULTADO: ${{ job.status }}
        run: .plantillas/scripts/documentos.sh epp > evidencia/cd/EPP.md && cat evidencia/cd/EPP.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EPP-${{ inputs.ambiente }}-v${{ needs.ci.outputs.version }}-${{ github.run_number }}
          path: evidencia/cd/
